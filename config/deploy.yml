# Deploy with Kamal: https://kamal-deploy.org
#
# The server address and every secret are read from the environment, never
# committed. See .kamal/secrets for the full list.
service: antilibrary

# Kamal prepends registry.server below, giving ghcr.io/coolnesss/library.
image: coolnesss/library

servers:
  web:
    - <%= ENV.fetch("KAMAL_HOST") %>

proxy:
  ssl: true
  app_port: 3000
  healthcheck:
    path: /up
  hosts:
    - antilibrary.net
    - www.antilibrary.net
    # Used to test the server before DNS moves over. Safe to drop afterwards.
    - new.antilibrary.net

registry:
  server: ghcr.io
  username: Coolnesss
  password:
    - KAMAL_REGISTRY_PASSWORD

# Built on the server itself: it is x86 and the laptop is ARM, so building
# locally would mean emulation.
builder:
  arch: amd64
  remote: ssh://root@<%= ENV.fetch("KAMAL_HOST") %>

env:
  clear:
    WEB_CONCURRENCY: 2
    RAILS_MAX_THREADS: 5
  secret:
    - SECRET_KEY_BASE
    - S3_BUCKET_NAME
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY
    - AWS_REGION
    - S3_ENDPOINT
    - GMAIL_APP_USER
    - GMAIL_APP_PASS

# The SQLite database. Without this volume every deploy would start an empty one.
volumes:
  - "antilibrary_storage:/rails/storage"

# Continuous backup of the SQLite database to a private S3 bucket. Runs as the
# same uid as the app so the files it writes next to the database stay writable
# by Puma.
accessories:
  litestream:
    image: litestream/litestream:0.3.13
    host: <%= ENV.fetch("KAMAL_HOST") %>
    cmd: replicate -config /etc/litestream.yml
    options:
      user: 1000:1000
    volumes:
      - antilibrary_storage:/rails/storage
    files:
      - config/litestream.yml.erb:/etc/litestream.yml
    env:
      secret:
        - AWS_ACCESS_KEY_ID
        - AWS_SECRET_ACCESS_KEY

  # Umami analytics. Postgres is only ever used by Umami; the library itself
  # stays on SQLite so that an Umami upgrade cannot take the books offline.
  umami-db:
    image: postgres:17
    host: <%= ENV.fetch("KAMAL_HOST") %>
    env:
      clear:
        POSTGRES_DB: umami
        POSTGRES_USER: umami
      secret:
        - POSTGRES_PASSWORD
    volumes:
      - umami_db_data:/var/lib/postgresql/data

  umami:
    image: ghcr.io/umami-software/umami:3.4.0
    host: <%= ENV.fetch("KAMAL_HOST") %>
    env:
      clear:
        # The layout loads script.js, the v3 default, which is still served.
        # This also serves the tracker at umami.js, the name used before the
        # upgrade, for pages that still reference it; safe to drop later.
        TRACKER_SCRIPT_NAME: umami.js
      secret:
        - DATABASE_URL
        - APP_SECRET
    proxy:
      hosts:
        - analytics.antilibrary.net
        # Temporary alias; safe to drop once nothing uses it.
        - analytics-new.antilibrary.net
      app_port: 3000
      ssl: true
      healthcheck:
        # Umami has no /up. It also runs database migrations before serving,
        # so allow more than the default 30s on a cold boot.
        path: /api/heartbeat
        timeout: 120

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  dbconsole: app exec --interactive --reuse "bin/rails dbconsole"
  shell: app exec --interactive --reuse "bash"
  logs: app logs --follow
